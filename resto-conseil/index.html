<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RESTO CONSEIL Trailer</title>
<style>
  @font-face{font-family:Cormorant;src:url(fonts/cormorant-normal.woff2) format('woff2');font-weight:300 700;font-style:normal}
  @font-face{font-family:Cormorant;src:url(fonts/cormorant-italic.woff2) format('woff2');font-weight:300 700;font-style:italic}
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block}
  body.preview{display:flex;align-items:center;justify-content:center}
  body.preview canvas{max-width:100vw;max-height:100vh;width:auto;height:auto}
  #ui{position:fixed;left:12px;bottom:10px;font:12px Inter,system-ui;color:#c9a26a;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* RESTO CONSEIL — film de marque 55 s.
   ?f=916 | 45 | 169   format (1080×1920, 1080×1350, 1920×1080)
   ?s=2                échelle (4K pour le 16:9)
   ?render             mode rendu (render(t) piloté par render.mjs)            */
const Q=new URLSearchParams(location.search);
const FMT=Q.get('f')||'169', SC=+(Q.get('s')||1), RENDER=Q.has('render');
const W={916:1080,45:1080,169:1920}[FMT], H={916:1920,45:1350,169:1080}[FMT];
const PORT=H>W*1.3, WIDE=W>H, U=Math.min(W,H)/1080;
const DUR=55;
const cv=document.getElementById('c'); cv.width=W*SC; cv.height=H*SC;
const X=cv.getContext('2d');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const BC=mkc(W*SC,H*SC), B=BC.getContext('2d');
const TC=mkc(W*SC,H*SC), TX=TC.getContext('2d');

/* ---------- maths ---------- */
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const ss=(a,b,v)=>{const k=cl((v-a)/(b-a));return k*k*(3-2*k)};
const eio=k=>(k=cl(k),k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
const eo=k=>1-Math.pow(1-cl(k),3);
const esin=k=>.5-.5*Math.cos(Math.PI*cl(k));
function R(seed){let s=seed|0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const N1=(t,s=0)=>.5+.22*Math.sin(t*1.7+s*3.1)+.16*Math.sin(t*3.9+s*1.3)+.1*Math.sin(t*7.3+s*5.7);

/* ---------- colour ---------- */
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const AMB=[255,170,84], WARM=[255,206,146], GOLD=[201,162,106], GOLD2=[230,203,152], IVORY=[250,246,238], CREAM=[243,235,221], WHITE=[255,250,242], COOL=[190,210,255];
function lg(x,x0,y0,x1,y1,st){const g=x.createLinearGradient(x0,y0,x1,y1);for(const[o,c]of st)g.addColorStop(cl(o),c);return g}
function rg(x,cx,cy,r0,r1,st){const g=x.createRadialGradient(cx,cy,r0,cx,cy,r1);for(const[o,c]of st)g.addColorStop(cl(o),c);return g}
function ell(x,cx,cy,rx,ry,fill){x.beginPath();x.ellipse(cx,cy,Math.max(rx,.01),Math.max(ry,.01),0,0,Math.PI*2);x.fillStyle=fill;x.fill()}
function poly(x,pts,fill){if(pts.some(p=>!p))return;x.beginPath();x.moveTo(pts[0].x,pts[0].y);for(const p of pts.slice(1))x.lineTo(p.x,p.y);x.closePath();x.fillStyle=fill;x.fill()}
function glow(x,cx,cy,r,c,a,mode='lighter'){if(!(r>0.5)||a<=0)return;x.save();x.globalCompositeOperation=mode;
  x.fillStyle=rg(x,cx,cy,0,r,[[0,rgba(c,a)],[.18,rgba(c,a*.55)],[.45,rgba(c,a*.18)],[1,rgba(c,0)]]);x.fillRect(cx-r,cy-r,2*r,2*r);x.restore()}
function rrect(x,px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}

/* ---------- 3D camera (pinhole) ---------- */
let CAM={x:0,y:1.6,z:0}, FOC=1000, HY=540;
function setCam(cx,cy,cz,hy=.5,fk=1){CAM={x:cx,y:cy,z:cz};HY=H*hy;FOC=Math.max(W*.62,H*.55)*fk}
function P(px,py,pz){const dz=pz-CAM.z;if(dz<.12)return null;const s=FOC/dz;return{x:W/2+(px-CAM.x)*s,y:HY+(CAM.y-py)*s,s,dz}}

/* ---------- textures ---------- */
const TEX={};
function tex(w,h,f){const c=mkc(w,h);f(c.getContext('2d'),w,h);return c}
function initTex(){
  let r=R(11);
  TEX.marble=tex(512,512,(x,w,h)=>{x.fillStyle=lg(x,0,0,w,h,[[0,'#efeae2'],[1,'#ddd6cb']]);x.fillRect(0,0,w,h);
    for(let i=0;i<22;i++){x.beginPath();let px=r()*w*1.4-w*.2,py=-30;x.moveTo(px,py);
      for(let k=0;k<6;k++){const nx=px+(r()-.4)*160,ny=py+h/5;x.quadraticCurveTo(px+(r()-.5)*120,py+h/10,nx,ny);px=nx;py=ny}
      const gold=i%7===0;x.strokeStyle=gold?`rgba(176,138,82,${.35+r()*.3})`:`rgba(${95+r()*50|0},${92+r()*40|0},${90+r()*40|0},${.06+r()*.3})`;
      x.lineWidth=gold?1.2+r()*2:.4+r()*2.6;x.filter=`blur(${(r()*1.6).toFixed(2)}px)`;x.stroke()}x.filter='none'});
  const wood=(base,dk,lt)=>tex(512,512,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);
    for(let i=0;i<190;i++){const y0=r()*h,a=2+r()*9,fr=.004+r()*.01,ph=r()*7;x.beginPath();
      for(let px=0;px<=w;px+=8){const y=y0+Math.sin(px*fr+ph)*a+Math.sin(px*fr*3.1+ph)*a*.3;px?x.lineTo(px,y):x.moveTo(px,y)}
      x.strokeStyle=r()<.6?rgba(dk,.06+r()*.22):rgba(lt,.04+r()*.12);x.lineWidth=.6+r()*2.2;x.stroke()}});
  TEX.walnut=wood('#4f321f',[28,16,8],[120,82,52]);
  TEX.oak=wood('#8b6744',[70,46,26],[190,150,105]);
  TEX.brass=tex(512,512,(x,w,h)=>{x.fillStyle=lg(x,0,0,w,h,[[0,'#6b4f24'],[.25,'#d9b66c'],[.45,'#8a6a33'],[.7,'#f1d99e'],[1,'#74552a']]);x.fillRect(0,0,w,h);
    for(let i=0;i<900;i++){x.fillStyle=r()<.5?'rgba(255,240,200,.07)':'rgba(40,25,5,.07)';x.fillRect(r()*w,r()*h,20+r()*120,1)}});
  TEX.linen=tex(256,256,(x,w,h)=>{x.fillStyle='#e3d7c3';x.fillRect(0,0,w,h);
    for(let i=0;i<w;i+=2){x.fillStyle=`rgba(90,70,40,${.03+r()*.07})`;x.fillRect(i,0,1,h);x.fillStyle=`rgba(90,70,40,${.03+r()*.06})`;x.fillRect(0,i,w,1)}});
  TEX.terra=tex(256,256,(x,w,h)=>{x.fillStyle=lg(x,0,0,w,h,[[0,'#bb6a45'],[1,'#a2563a']]);x.fillRect(0,0,w,h);
    for(let i=0;i<5000;i++){x.fillStyle=r()<.5?'rgba(60,20,8,.12)':'rgba(255,210,170,.08)';x.fillRect(r()*w,r()*h,1+r()*2,1+r()*2)}});
  TEX.velvet=tex(256,256,(x,w,h)=>{x.fillStyle=rg(x,w*.35,h*.3,0,w*.9,[[0,'#3f6450'],[.6,'#22382b'],[1,'#132019']]);x.fillRect(0,0,w,h)});
  TEX.slate=tex(512,512,(x,w,h)=>{x.fillStyle='#262524';x.fillRect(0,0,w,h);
    for(let i=0;i<9000;i++){x.fillStyle=r()<.5?'rgba(0,0,0,.18)':'rgba(255,255,255,.035)';x.fillRect(r()*w,r()*h,1+r()*2,1)}
    for(let i=0;i<30;i++){x.fillStyle='rgba(255,255,255,.02)';x.fillRect(0,r()*h,w,1+r()*5)}});
  TEX.grain=[0,1,2,3].map(k=>{const c=mkc(256,256),g=c.getContext('2d'),id=g.createImageData(256,256),rr=R(100+k);
    for(let i=0;i<id.data.length;i+=4){const v=rr()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}g.putImageData(id,0,0);return c});
}
function texFill(x,img,px,py,w,h,sc=1){x.save();x.beginPath();x.rect(px,py,w,h);x.clip();const p=x.createPattern(img,'repeat');
  p.setTransform(new DOMMatrix().translate(px,py).scale(sc));x.fillStyle=p;x.fillRect(px,py,w,h);x.restore()}

/* ---------- people (silhouettes, never faces) ---------- */
function person(x,px,pz,o={}){
  const sit=o.pose==='sit', sway=o.sway||0;
  const hx=px+sway, hy=sit?1.2:1.67, sy=sit?1.03:1.47, wy=sit?.62:.95;
  const h=P(hx,hy,pz), s1=P(px+sway*.5,sy,pz), w1=P(px,wy,pz), f0=P(px,0,pz);if(!h||!f0)return;
  const s=h.s, body=o.col||'#120d0a';
  const path=new Path2D(), sw=.235*s*(o.wide||1), ww=.17*s;
  path.moveTo(s1.x-sw,s1.y+.12*s);path.quadraticCurveTo(s1.x-sw,s1.y-.05*s,s1.x-sw*.45,s1.y-.07*s);
  path.lineTo(s1.x+sw*.45,s1.y-.07*s);path.quadraticCurveTo(s1.x+sw,s1.y-.05*s,s1.x+sw,s1.y+.12*s);
  path.lineTo(w1.x+ww,w1.y);path.lineTo(w1.x-ww,w1.y);path.closePath();
  if(!sit){path.rect(w1.x-ww*.95,w1.y-2,ww*.85,f0.y-w1.y);path.rect(w1.x+ww*.1,w1.y-2,ww*.85,f0.y-w1.y)}
  path.rect(h.x-.045*s,h.y,.09*s,s1.y-h.y);
  path.ellipse(h.x,h.y,.088*s,.108*s,0,0,Math.PI*2);
  if(o.hair==='long')path.ellipse(h.x,h.y+.06*s,.1*s,.13*s,0,0,Math.PI*2);
  x.fillStyle=body;x.fill(path);
  if(o.jacket){const jp=new Path2D();jp.moveTo(s1.x-sw,s1.y+.12*s);jp.quadraticCurveTo(s1.x-sw,s1.y-.05*s,s1.x-sw*.45,s1.y-.07*s);
    jp.lineTo(s1.x+sw*.45,s1.y-.07*s);jp.quadraticCurveTo(s1.x+sw,s1.y-.05*s,s1.x+sw,s1.y+.12*s);jp.lineTo(w1.x+ww,w1.y+.08*s);jp.lineTo(w1.x-ww,w1.y+.08*s);jp.closePath();
    x.fillStyle=lg(x,s1.x-sw,0,s1.x+sw,0,[[0,o.jacket[0]],[.6,o.jacket[1]],[1,o.jacket[2]||o.jacket[1]]]);x.fill(jp)}
  if(o.arms)for(const a of o.arms){const sh=P(px+a.side*.2,sy-.04,pz),hd=P(a.hx,a.hy,a.hz);if(!sh||!hd)continue;
    x.strokeStyle=o.jacket?o.jacket[1]:body;x.lineCap='round';x.lineWidth=.075*s;x.beginPath();x.moveTo(sh.x,sh.y);
    x.quadraticCurveTo(lerp(sh.x,hd.x,.75),lerp(sh.y,hd.y,.1)+.05*s,hd.x,hd.y);x.stroke();
    if(a.glass)flute(x,hd.x,hd.y,hd.s,o.rim||WARM)}
  if(o.rim){x.save();x.clip(path);const d=o.rimSide||1;
    x.fillStyle=lg(x,h.x-d*.3*s,0,h.x+d*.3*s,0,[[0,rgba(o.rim,0)],[.7,rgba(o.rim,0)],[1,rgba(o.rim,o.rimA||.5)]]);x.fillRect(h.x-.4*s,h.y-.2*s,.8*s,f0.y-h.y+.3*s);x.restore()}
  if(o.tray){const tp=P(px+o.tray*.32,1.25,pz-.05);if(tp){ell(x,tp.x,tp.y,.24*s,.035*s,'#bdb6aa');
    x.fillStyle=lg(x,tp.x-.14*s,0,tp.x+.14*s,0,[[0,'#6c665d'],[.45,'#f1ebe0'],[1,'#7d766c']]);x.beginPath();x.ellipse(tp.x,tp.y,.14*s,.12*s,0,Math.PI,0);x.fill();
    glow(x,tp.x-.04*s,tp.y-.07*s,.08*s,WHITE,.6)}}
}
function flute(x,cx,cy,s,lightC){const bw=.035*s,bh=.13*s;
  x.fillStyle=lg(x,0,cy-bh,0,cy,[[0,'rgba(255,236,190,.35)'],[1,'rgba(232,186,92,.85)']]);
  x.beginPath();x.moveTo(cx-bw,cy-bh);x.lineTo(cx+bw,cy-bh);x.quadraticCurveTo(cx+bw,cy,cx,cy+.01*s);x.quadraticCurveTo(cx-bw,cy,cx-bw,cy-bh);x.fill();
  x.strokeStyle='rgba(255,245,225,.55)';x.lineWidth=Math.max(1,.004*s);x.stroke();
  x.beginPath();x.moveTo(cx,cy+.01*s);x.lineTo(cx,cy+.09*s);x.stroke();
  glow(x,cx+bw*.4,cy-bh*.6,.05*s,lightC,.55)}

/* ---------- furniture ---------- */
function chair(x,cx,cz,col='#2a1b12'){const t=P(cx,.95,cz),b=P(cx,0,cz);if(!t)return;const w=.21*t.s;
  x.fillStyle=col;rrect(x,t.x-w,t.y,2*w,b.y-t.y,.05*t.s);x.fill();x.fillStyle='rgba(255,200,140,.08)';x.fillRect(t.x-w,t.y,2*w,.03*t.s)}
function tableObj(tx,tz,o={}){return{z:tz,d:x=>{
  const r=o.r||.42, th=.76, c=P(tx,th,tz), f0=P(tx,0,tz);if(!c)return;const s=c.s, rx=r*s, ry=Math.max(rx*.04,rx*(CAM.y-th)/(tz-CAM.z)*.95);
  ell(x,f0.x,f0.y,rx*1.6,rx*.2,'rgba(0,0,0,.35)');
  if(!o.noChairs)for(const k of[-1,1])chair(x,tx+k*(r+.2),tz+.08,o.chair);
  if(o.people)for(const k of o.people)person(x,tx+k*(r+.14),tz+.1,{pose:'sit',sway:Math.sin(T*1.1+(o.seed||0)+k)*.02,rim:o.rim||AMB,rimSide:-k,rimA:.55,col:o.pcol,hair:((o.seed*7+k)|0)%3===0?'long':0});
  const cloth=o.cloth||[[255,246,230],[150,120,95]];
  if(o.square){x.fillStyle=lg(x,0,c.y,0,f0.y,[[0,rgba(cloth[0],1)],[1,rgba(cloth[1],1)]]);x.fillRect(c.x-rx,c.y,2*rx,(f0.y-c.y)*.9);
    poly(x,[P(tx-r,th,tz-r),P(tx+r,th,tz-r),P(tx+r,th,tz+r),P(tx-r,th,tz+r)],rgba(cloth[0],1))}
  else if(o.bistro){x.fillStyle='#1a1410';x.fillRect(c.x-.025*s,c.y,.05*s,f0.y-c.y);ell(x,f0.x,f0.y,.18*s,.04*s,'#1a1410');ell(x,c.x,c.y+.012*s,rx,ry,'#3a2f27');
    x.save();ell(x,c.x,c.y,rx,ry,'#e9e3d9');x.clip();x.globalAlpha=.6;x.drawImage(TEX.marble,c.x-rx,c.y-ry,2*rx,2*ry);x.restore()}
  else{x.fillStyle=lg(x,c.x-rx,0,c.x+rx,0,[[0,rgba(cloth[1],1)],[.45,rgba(cloth[0],1)],[1,rgba(cloth[1],1)]]);x.fillRect(c.x-rx,c.y,2*rx,(f0.y-c.y)*.94);
    ell(x,c.x,c.y+(f0.y-c.y)*.94,rx,ry*.9,rgba(cloth[1],1));
    ell(x,c.x,c.y,rx,ry,lg(x,0,c.y-ry,0,c.y+ry,[[0,rgba(cloth[0],1)],[1,rgba(WHITE,1)]]))}
  if(!o.bare){for(const k of[-.45,.45]){ell(x,c.x+k*rx,c.y,rx*.22,ry*.22,'rgba(255,255,255,.95)');ell(x,c.x+k*rx,c.y,rx*.14,ry*.14,'rgba(225,215,200,.9)')}
    for(const k of[-.12,.15]){x.fillStyle='rgba(255,250,240,.75)';x.fillRect(c.x+k*rx,c.y-.1*s,Math.max(1,.012*s),.1*s);glow(x,c.x+k*rx,c.y-.08*s,.03*s,WHITE,.5)}
    glow(x,c.x,c.y-.03*s,rx*1.5,o.candle||AMB,.38);glow(x,c.x,c.y-.04*s,.05*s,WARM,.9)}
}}}
function lampObj(lx,lz,ly,o,kind='dome'){return{z:lz-.02,d:x=>{
  const top=P(lx,o.CH,lz),b=P(lx,ly,lz);if(!b)return;const s=b.s;
  x.strokeStyle='rgba(20,14,10,.9)';x.lineWidth=Math.max(1,.008*s);x.beginPath();x.moveTo(top.x,top.y);x.lineTo(b.x,b.y);x.stroke();
  if(kind==='globe'){ell(x,b.x,b.y+.12*s,.13*s,.13*s,rg(x,b.x-.03*s,b.y+.09*s,0,.14*s,[[0,'#fff8ea'],[1,'#f2c98a']]));glow(x,b.x,b.y+.12*s,1.1*s,AMB,.45);return}
  if(kind==='bulb'){glow(x,b.x,b.y,.5*s,AMB,.6);glow(x,b.x,b.y,.06*s,WHITE,1);return}
  x.fillStyle=lg(x,b.x-.2*s,0,b.x+.2*s,0,[[0,'#3b2a19'],[.5,'#b48b51'],[1,'#3b2a19']]);x.beginPath();x.ellipse(b.x,b.y+.1*s,.21*s,.13*s,0,Math.PI,0);x.fill();
  ell(x,b.x,b.y+.1*s,.2*s,.03*s,'#ffe2b0');glow(x,b.x,b.y+.12*s,1.2*s,AMB,.42);glow(x,b.x,b.y+.11*s,.18*s,WARM,.8)}}}
function chandelierObj(cxw,cz,cy,o){return{z:cz-.03,d:x=>{
  const top=P(cxw,o.CH,cz),c=P(cxw,cy,cz);if(!c)return;const s=c.s;
  x.strokeStyle='rgba(180,140,80,.6)';x.lineWidth=Math.max(1,.01*s);x.beginPath();x.moveTo(top.x,top.y);x.lineTo(c.x,c.y-.5*s);x.stroke();
  glow(x,c.x,c.y,2.6*s,AMB,.34);
  for(const[ry,rr,n]of[[-.35,.32,8],[0,.6,12],[.3,.42,10]]){for(let i=0;i<n;i++){const a=i/n*Math.PI*2+T*.15;
    const px=c.x+Math.cos(a)*rr*s,py=c.y+ry*s+Math.sin(a)*rr*s*.18;
    x.strokeStyle='rgba(255,230,190,.35)';x.lineWidth=Math.max(.6,.006*s);x.beginPath();x.moveTo(px,py);x.lineTo(px,py+.16*s);x.stroke();
    glow(x,px,py,.09*s,WARM,.9)}}
  glow(x,c.x,c.y,.5*s,WHITE,.35)}}}
function spotObj(sx,sz,o){return{z:sz-.04,d:x=>{const a=P(sx,o.CH,sz),b=P(sx,.78,sz);if(!a||!b)return;
  x.save();x.globalCompositeOperation='lighter';x.fillStyle=lg(x,0,a.y,0,b.y,[[0,'rgba(255,214,160,.12)'],[1,'rgba(255,214,160,.02)']]);
  x.beginPath();x.moveTo(a.x-.03*a.s,a.y);x.lineTo(a.x+.03*a.s,a.y);x.lineTo(b.x+.55*b.s,b.y);x.lineTo(b.x-.55*b.s,b.y);x.fill();x.restore();glow(x,a.x,a.y,.08*a.s,WHITE,.9)}}}

/* ---------- room engine ---------- */
function room(x,o,lt){
  x.fillStyle=lg(x,0,0,0,HY,[[0,o.ceil[0]],[1,o.ceil[1]]]);x.fillRect(0,0,W,HY+1);
  x.fillStyle=lg(x,0,HY,0,H,[[0,o.floor[0]],[1,o.floor[1]]]);x.fillRect(0,HY,W,H-HY);
  if(o.floorFn)o.floorFn(x,o,lt);
  const zn=CAM.z+.25;
  for(const sd of[-1,1]){const a=P(sd*o.RW,0,zn),b=P(sd*o.RW,o.CH,zn),c=P(sd*o.RW,o.CH,o.D),d=P(sd*o.RW,0,o.D);
    poly(x,[a,b,c,d],lg(x,a.x,0,d.x,0,[[0,o.wall[0]],[1,o.wall[1]]]));if(o.sideFn)o.sideFn(x,sd,o,lt)}
  const tl=P(-o.RW,o.CH,o.D),br=P(o.RW,0,o.D),r={x0:tl.x,y0:tl.y,x1:br.x,y1:br.y};
  x.save();x.beginPath();x.rect(r.x0,r.y0,r.x1-r.x0,r.y1-r.y0);x.clip();o.back(x,r,o,lt);x.restore();
  o.items.sort((a,b)=>b.z-a.z);for(const it of o.items)if(it.z>CAM.z+.35)it.d(x);
  if(o.haze){x.save();x.globalCompositeOperation='screen';const k=HY/H;

      if(tot<=maxW){let px=W/2-tot/2;for(const q of parts){items.push({s:q.s,a:q.a,x:px+q.w/2,y:cy});px+=q.w+gap}}
      else{const lh=size*1.12;parts.forEach((q,i)=>items.push({s:q.s,a:q.a,x:W/2,y:cy+(i-(parts.length-1)/2)*lh}))}}
    else{const lines=wrap(x,c.t.split(' '),maxW),lh=size*(c.k==='it'?1.08:1.12);lines.forEach((l,i)=>items.push({s:l,a:c.a+i*.18,x:W/2,y:cy+(i-(lines.length-1)/2)*lh}))}
    // scrim
    const ys=items.map(i=>i.y),top=Math.min(...ys)-size*2.8,bot=Math.max(...ys)+size*2.8,vis=ss(c.a,c.a+.5,t)*out;
    x.fillStyle=lg(x,0,top,0,bot,[[0,'rgba(8,6,4,0)'],[.2,`rgba(8,6,4,${.08*vis})`],[.38,`rgba(8,6,4,${.3*vis})`],[.5,`rgba(8,6,4,${.38*vis})`],[.62,`rgba(8,6,4,${.3*vis})`],[.8,`rgba(8,6,4,${.08*vis})`],[1,'rgba(8,6,4,0)']]);x.fillRect(0,top,W,bot-top);
    x.textAlign='center';x.textBaseline='middle';
    for(const it of items){const e=ss(it.a,it.a+.7,t),al=e*out;if(al<=0)continue;
      capStyle(x,c.k,size);if(c.k!=='it')x.letterSpacing=`${size*lerp(.3,.13,eo(ss(it.a,it.a+1.2,t)))}px`;
      x.filter=`blur(${((1-e)*8*U).toFixed(2)}px)`;x.fillStyle=`rgba(250,244,232,${al})`;
      x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=U*24;x.fillText(it.s,it.x+(c.k!=='it'?size*.065:0),it.y+(1-eo(e))*U*22);x.shadowColor='transparent';x.filter='none'}
    x.letterSpacing='0px';x.textBaseline='alphabetic'}
}
function kicker(x,t){for(const s of SHOTS){if(!s.kick||t<s.a||t>=s.b)continue;const al=ss(s.a+.1,s.a+.45,t)*(1-ss(s.b-.25,s.b,t));if(al<=0)continue;
  const fs=Math.round(U*(PORT?24:20)),y=PORT?H*.15:H-GUT*.9,x0=GUT;x.font=`500 ${fs}px Inter`;x.letterSpacing=`${fs*.3}px`;x.textAlign='left';x.textBaseline='middle';
  x.fillStyle=`rgba(201,162,106,${al})`;x.fillRect(x0,y-1,U*44*eo(ss(s.a+.1,s.a+.6,t)),Math.max(1,U*1.5));
  x.fillStyle=`rgba(236,214,170,${al})`;x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=U*12;x.fillText(s.kick.toUpperCase(),x0+U*62,y);x.shadowColor='transparent';x.letterSpacing='0px';x.textBaseline='alphabetic'}}

/* ---------- signature (logo provisoire) ---------- */
function endCard(x,t){const t0=49.0;if(t<t0-.2)return;const k=t-t0;
  x.fillStyle=rg(x,W/2,H/2,0,Math.max(W,H)*.8,[[0,'#17120d'],[1,'#050403']]);x.fillRect(0,0,W,H);
  glow(x,W/2,H*.45,Math.max(W,H)*.5,AMB,.06*ss(0,2,k));
  const cy=H*(PORT?.43:.4),R0=U*(PORT?62:58);
  x.strokeStyle=`rgba(201,162,106,${.9*ss(0,.4,k)})`;x.lineWidth=U*1.6;x.beginPath();x.arc(W/2,cy-R0*1.9,R0,-Math.PI/2,-Math.PI/2+Math.PI*2*eio(ss(0,1.4,k)));x.stroke();
  x.textAlign='center';x.textBaseline='middle';
  const ma=ss(.6,1.4,k);x.font=`400 ${R0*.82}px Cormorant`;x.letterSpacing=`${R0*.04}px`;x.fillStyle=`rgba(230,203,152,${ma})`;x.fillText('RC',W/2+R0*.02,cy-R0*1.9+R0*.04);
  // wordmark
  let fs=U*(PORT?80:88);x.font=`400 ${fs}px Cormorant`;const ls=lerp(.5,.3,eo(ss(.9,2.6,k)));x.letterSpacing=`${fs*ls}px`;
  while(x.measureText('RESTO CONSEIL').width>W-2*GUT){fs*=.95;x.font=`400 ${fs}px Cormorant`;x.letterSpacing=`${fs*ls}px`}
  const wa=ss(.9,1.9,k);x.filter=`blur(${((1-wa)*6*U).toFixed(2)}px)`;x.fillStyle=`rgba(250,244,232,${wa})`;x.fillText('RESTO CONSEIL',W/2+fs*ls/2,cy);x.filter='none';
  // light sweep on the wordmark
  const sw=ss(1.8,3.4,k);if(sw>0&&sw<1){x.save();x.globalCompositeOperation='source-atop';const sx=lerp(W*.15,W*.85,sw);x.fillStyle=lg(x,sx-U*120,0,sx+U*120,0,[[0,'rgba(255,230,180,0)'],[.5,'rgba(255,230,180,.0)'],[1,'rgba(255,230,180,0)']]);x.restore();glow(x,sx,cy,U*140,WARM,.12*Math.sin(Math.PI*sw))}
  x.fillStyle=`rgba(201,162,106,${ss(1.6,2.4,k)})`;x.fillRect(W/2-U*40*eo(ss(1.6,2.6,k)),cy+fs*.75,U*80*eo(ss(1.6,2.6,k)),Math.max(1,U*1.4));
  // tagline
  const tl=ss(2.0,2.9,k),ts=U*(PORT?50:44);x.font=`italic 300 ${ts}px Cormorant`;x.letterSpacing='0px';x.fillStyle=`rgba(250,244,232,${tl*.95})`;
  const tag='Des concepts singuliers. Des performances durables.';
  if(x.measureText(tag).width>W-2*GUT){x.fillText('Des concepts singuliers.',W/2,cy+fs*1.5+(1-eo(tl))*U*14);x.fillText('Des performances durables.',W/2,cy+fs*1.5+ts*1.15+(1-eo(tl))*U*14)}
  else x.fillText(tag,W/2,cy+fs*1.55+(1-eo(tl))*U*14);
  const two=x.measureText(tag).width>W-2*GUT;
  const sy=cy+fs*1.55+(two?ts*1.15:0)+ts*1.6;
  const sv=ss(3.2,4.0,k),ss2=Math.round(U*(PORT?24:21));x.font=`500 ${ss2}px Inter`;x.letterSpacing=`${ss2*.34}px`;x.fillStyle=`rgba(201,162,106,${sv})`;
  x.fillText('CONSEIL  •  CRÉATION  •  DÉVELOPPEMENT',W/2+ss2*.17,sy);
  const ua=ss(4.0,4.8,k),us=Math.round(U*(PORT?26:22));x.font=`300 ${us}px Inter`;x.letterSpacing=`${us*.12}px`;x.fillStyle=`rgba(250,244,232,${ua*.7})`;x.fillText('www.resto-conseil.com',W/2+us*.06,sy+ss2*2.4);
  x.letterSpacing='0px';x.textBaseline='alphabetic';
  if(k<.2){x.fillStyle=`rgba(0,0,0,${1-k/.2})`;x.fillRect(0,0,W,H)}}

/* ---------- frame ---------- */
let T=0,FRAME=0;
function render(t){T=t;FRAME=Math.round(t*30);
  X.setTransform(1,0,0,1,0,0);X.fillStyle='#000';X.fillRect(0,0,cv.width,cv.height);X.setTransform(SC,0,0,SC,0,0);
  const act=SHOTS.filter(s=>t>=s.a&&t<s.b);
  act.forEach((s,i)=>{B.setTransform(1,0,0,1,0,0);B.clearRect(0,0,BC.width,BC.height);B.setTransform(SC,0,0,SC,0,0);B.save();
    s.fn(B,(t-s.a)/(s.b-s.a),t-s.a,s.b-s.a,s);B.restore();
    X.globalAlpha=i===0?1:(s.fi?ss(s.a,s.a+s.fi,t):1);X.setTransform(1,0,0,1,0,0);X.drawImage(BC,0,0);X.setTransform(SC,0,0,SC,0,0);X.globalAlpha=1});
  // light leaks on beat cuts
  for(const c of CUTS){const d=t-c;if(d<-.05||d>.45)continue;const a=d<0?ss(-.05,0,d):1-ss(0,.45,d);const side=(c*7%2)<1?0:W;
    X.save();X.globalCompositeOperation='screen';X.fillStyle=lg(X,side,0,W-side,0,[[0,`rgba(255,170,90,${.35*a})`],[.5,`rgba(255,140,60,${.08*a})`],[1,'rgba(0,0,0,0)']]);X.fillRect(0,0,W,H);X.restore()}
  // vignette
  X.fillStyle=rg(X,W/2,H/2,Math.min(W,H)*.35,Math.hypot(W,H)*.62,[[0,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.55)']]);X.fillRect(0,0,W,H);
  // fades
  const blk=Math.max(1-ss(0,.9,t),ss(48.3,49.0,t)*(t<49.2?1:0));if(blk>0){X.fillStyle=`rgba(0,0,0,${blk})`;X.fillRect(0,0,W,H)}
  captions(X,t);kicker(X,t);endCard(X,t);
  // film grain
  X.save();X.globalCompositeOperation='overlay';X.globalAlpha=.07;const g=TEX.grain[FRAME%4],pt=X.createPattern(g,'repeat');const rr=R(FRAME*13+1);
  pt.setTransform(new DOMMatrix().translate(rr()*256,rr()*256).scale(U*1.2));X.fillStyle=pt;X.fillRect(0,0,W,H);X.restore();
  // fin
  // le logo reste à l’écran jusqu’à la dernière image (boucle Reels / vignette)
}
initTex();
window.render=render;window.READY=document.fonts.load('300 40px Cormorant').then(()=>document.fonts.load('italic 300 40px Cormorant')).then(()=>document.fonts.load('500 20px Inter')).then(()=>true);
if(!RENDER){document.body.classList.add('preview');const st=performance.now();const loop=()=>{render(((performance.now()-st)/1000)%DUR);requestAnimationFrame(loop)};READY.then(loop)}
</script>
